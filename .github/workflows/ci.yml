name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: lint / format / typecheck / test / cdk synth
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # AWS には一切アクセスしない（認証情報は渡さない）
      AWS_EC2_METADATA_DISABLED: 'true'
      CDK_DISABLE_CLI_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        # tsc は TypeScript 7（@typescript/native）。ESLint は typescript = 6.0 の API を使う
        run: |
          npx tsc --version
          node -p "'typescript (API for ESLint): ' + require('typescript').version"
          npm run typecheck

      - name: Test
        run: npm test

      - name: CDK synth
        # 環境非依存（account / region 未指定）で合成する。エージェントのバンドルも含む
        run: npx cdk synth --quiet --no-notices

      - name: Upload CloudFormation template
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudformation-template
          path: cdk.out/*.template.json
          retention-days: 7
          if-no-files-found: error
